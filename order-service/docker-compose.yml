version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: order-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - order_pg_data:/var/lib/postgresql/data

volumes:
  order_pg_data:
